<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>RM Construction</title>

  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,sans-serif;color:#0f172a;background:#fff;line-height:1.6}
    .container{max-width:1100px;margin:0 auto;padding:40px 24px}
    .hero{padding:80px 24px;text-align:center;background:linear-gradient(135deg,#6366f1,#a855f7);color:#fff}

    .section{padding:60px 0}
    .section h2{font-size:32px;font-weight:800;margin-bottom:20px;letter-spacing:-0.02em}
    .services{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
    .service{padding:20px;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc}
    footer{padding:40px 24px;text-align:center;background:#0f172a;color:#94a3b8;font-size:14px}
    @media(max-width:640px){.hero h1{font-size:32px}.hero p{font-size:15px}.section h2{font-size:24px}}

</head>
