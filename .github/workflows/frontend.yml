name: Deploy Frontend to Amplify

on:
  push:
    branches: ["main", "feature/normal-changes" ]
    paths:
      - 'frontend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build
        env:
          VITE_UPLOADS_BASE_URL: "https://d24e11dzjriy3b.cloudfront.net"
          VITE_API_BASE_URL: "https://api.nqube.in/api"

      - name: Trigger Amplify Deploy
        run: |
          aws amplify start-job --app-id ${{ secrets.AMPLIFY_APP_ID }} --branch-name feature/normal-changes --job-type RELEASE
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: "ap-south-1"
